name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android tests and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      # Match compileSdk in app/tv and shared/wearos; AGP 8.10's default NDK.
      - name: Install Android build tools
        id: android-tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - name: Diagnose unavailable SDK packages
        if: ${{ failure() }}
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list --channel=3'
      # No account credentials or signing secrets are exposed to PR code.
      # AGP creates one disposable debug key shared by phone and watch.
      - run: chmod +x gradlew
      - name: Unit tests (phone)
        run: >-
          ./gradlew --no-daemon --stacktrace
          :app:testDevDebugUnitTest
      - name: Build phone APK with bundled Wear OS APK
        id: apk-build
        if: ${{ !cancelled() && steps.android-tools.outcome == 'success' }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleDevDebug
      - name: Record APK checksums
        if: ${{ !cancelled() && steps.apk-build.outcome == 'success' }}
        run: |
          mkdir -p build
          sha256sum app/build/outputs/apk/dev/debug/*.apk \
            wearos/build/outputs/apk/dev/debug/*.apk > build/apk-checksums.sha256
      - name: Upload test APKs
        if: ${{ !cancelled() && steps.apk-build.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bitchord-dev-debug-${{ github.run_number }}
          path: |
            app/build/outputs/apk/dev/debug/*.apk
            wearos/build/outputs/apk/dev/debug/*.apk
            build/apk-checksums.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/
            tv/build/reports/tests/
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: Android lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install Android platforms
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.0" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon --stacktrace :app:lintDevDebug
      - name: Upload lint reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-lint-${{ github.run_number }}
          path: app/build/reports/lint-results-*
          retention-days: 14

  shared:
    name: Shared JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Install shared library platform
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0"'
      - run: chmod +x gradlew
      - run: ./gradlew --no-daemon --stacktrace :shared:jvmTest :sharedUi:jvmTest
      - name: Upload shared test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: shared-test-reports-${{ github.run_number }}
          path: |
            shared/build/reports/tests/
            sharedUi/build/reports/tests/
          retention-days: 14

  backend:
    name: Backend Go
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  native:
    name: Native USB stream tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile and run existing C++ tests with sanitizers
        run: |
          mkdir -p build/host-tests
          g++ -std=c++17 -Wall -Wextra -fsanitize=address,undefined \
            -fno-omit-frame-pointer -g \
            -Iapp/src/main/cpp/bitperfect \
            app/src/main/cpp/bitperfect/tests/usb_stream_test.cpp \
            -o build/host-tests/usb_stream_test
          ./build/host-tests/usb_stream_test
