name: TV

# The Android TV app builds from the phone app's sources (see tv/README.md), so
# a change under app/, shared/, sharedUi/ or native/ can break it as easily as
# one under tv/.
on:
  push:
    branches: [main]
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
      - '.github/workflows/check.yml'

permissions:
  contents: read

concurrency:
  group: tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    name: Android TV
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Install Android build tools
        run: |
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" \
            --channel=3 "platforms;android-37" "platforms;android-36" \
            "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Diagnose unavailable SDK packages
        if: ${{ failure() }}
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --list --channel=3'

      - run: chmod +x gradlew

      - name: Build the TV dev APK
        run: ./gradlew :tv:assembleDevDebug

      - name: Upload the TV dev APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bitchord-tv-dev-debug
          path: tv/build/outputs/apk/dev/debug/*universal*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tv-build-reports
          path: tv/build/reports/
